; ============================================================
; PlatformIO Configuration – ESP32 Tourney GMI Module
; Target: Waveshare ESP32-S3-ETH (ESP32-S3, Dual-core Xtensa LX7)
; Ethernet: W5500 onboard via SPI2 (FSPI)
; Arduino Core: v3.x  (required for ETH.h + W5500 via lwIP)
; ============================================================

[platformio]
default_envs = esp32s3-eth

[env:esp32s3-eth]
platform  = espressif32@^6.6.0
board     = esp32-s3-devkitc-1
framework = arduino

; ---------- Serial Monitor ----------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------- Libraries ---------------
lib_deps =
    ; MQTT client (lightweight, supports TLS)
    knolleary/PubSubClient @ ^2.8.0
    ; JSON encode/decode for MQTT payloads
    bblanchon/ArduinoJson @ ^7.0.0

; ---------- Build flags -------------
build_flags =
    ; Enable W5500 Ethernet via lwIP (Arduino Core v3.x)
    -DETH_PHY_W5500=1
    ; Debug level: 0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose
    -DCORE_DEBUG_LEVEL=3
    ; SAS Polling interval (ms)
    -DSAS_POLL_INTERVAL_MS=40
    ; MQTT keep-alive interval (s)
    -DMQTT_KEEPALIVE=30
    ; Enable NVS (Non-Volatile Storage) for transaction persistence
    -DUSE_NVS=1
    ; ESP32-S3: Arduino USB CDC on boot (dùng USB UART, không dùng USB OTG)
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------- Upload settings ---------
upload_speed    = 921600
; ESP32-S3 thường upload qua USB CDC; nếu dùng UART adapter đổi sang:
; upload_protocol = esptool

; ---------- Partition table ---------
; Waveshare ESP32-S3-ETH có flash 8MB
board_build.partitions  = default_8MB.csv
board_upload.flash_size = 8MB
