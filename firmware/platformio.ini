; ============================================================
; PlatformIO Configuration – ESP32 Tourney GMI Module
; Target: Waveshare ESP32-S3-ETH (ESP32-S3R8, dual-core LX7,
;         16MB Flash / 8MB Octal PSRAM, onboard W5500 via SPI)
; Arduino Core: v3.x  (required for ETH.h + W5500 via lwIP)
; ============================================================

[platformio]
default_envs = esp32s3eth

[env:esp32s3eth]
platform  = espressif32@^6.6.0
board     = esp32-s3-devkitc-1
framework = arduino

; ---------- Serial Monitor ----------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------- Libraries ---------------
lib_deps =
    ; MQTT client (lightweight, supports TLS)
    knolleary/PubSubClient @ ^2.8.0
    ; JSON encode/decode for MQTT payloads
    bblanchon/ArduinoJson @ ^7.0.0

; ---------- Build flags -------------
build_flags =
    ; Enable ESP32 Arduino Core v3.x Ethernet (W5500 via lwIP)
    -DETH_PHY_W5500=1
    ; Debug level: 0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose
    -DCORE_DEBUG_LEVEL=3
    ; SAS Polling interval (ms)
    -DSAS_POLL_INTERVAL_MS=40
    ; MQTT keep-alive interval (s)
    -DMQTT_KEEPALIVE=30
    ; Enable NVS (Non-Volatile Storage) for transaction persistence
    -DUSE_NVS=1

; ---------- PSRAM / Flash ------------
; ESP32-S3R8: 16MB Flash (QIO) + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi

; ---------- Upload settings ---------
upload_speed = 921600

; ---------- Partition table ---------
; 16MB flash with OTA support
board_build.partitions = default_16MB.csv
