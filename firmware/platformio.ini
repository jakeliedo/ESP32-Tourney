; ============================================================
; PlatformIO Configuration – ESP32 Tourney GMI Module
; Target: WAVGAT/WT32-ETH01-Evo (ESP32-C3, RISC-V single-core)
; Ethernet: DM9051NP onboard via SPI (ETH_PHY_DM9051)
; Arduino Core: v3.x  (required for ETH.h + DM9051 via lwIP)
; NOTE: single core – SAS task and Network task now share Core 0,
; separated by FreeRTOS priority instead of core pinning.
; ============================================================

[platformio]
default_envs = eth01evo
; 2026-09-17: a `core_dir = F:/pio` line was committed here (machine
; `tech4` has a dedicated F: drive for the toolchain, to work around long-
; path/space constraints on C:) -- this broke every OTHER machine's build
; outright (`FileNotFoundError: ... 'F:\\'`, since core_dir has no
; per-invocation override in this project's build/flash workflow, unlike
; upload_port/upload_speed which are always passed explicitly). core_dir
; is inherently per-machine, not project config -- do NOT put it back
; here. If a machine genuinely needs its PlatformIO core dir off C:, set
; the PLATFORMIO_CORE_DIR environment variable locally on that machine
; instead (e.g. `setx PLATFORMIO_CORE_DIR F:\pio /M`), never in this
; shared file.

[env:eth01evo]
; The official "espressif32" registry platform is stuck on Arduino core
; 3.20017 (Dec 2024), whose ETH.h has NO SPI-Ethernet overload at all
; (only the old RMII/LAN8720 signature) - confirmed by a real build
; failure. pioarduino's actively-maintained fork bundles Arduino core
; 3.3.11, which added ETH_PHY_DM9051/W5500/KSZ8851 SPI support.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino

; ---------- Serial Monitor ----------
monitor_port    = COM7
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------- Libraries ---------------
lib_deps =
    ; MQTT client (lightweight, supports TLS)
    knolleary/PubSubClient @ ^2.8.0
    ; JSON encode/decode for MQTT payloads
    bblanchon/ArduinoJson @ ^7.0.0

; ---------- Build flags -------------
; NOTE: ETH_PHY_DM9051 is an eth_phy_type_t enum value (see ETH.h),
; passed directly to ETH.begin() in code – do NOT also -D define it
; as a macro here, that substitutes "1" into the enum declaration
; itself and breaks the ETH.h header (this bit us during a real build).
build_flags =
    ; Debug level: 0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose
    -DCORE_DEBUG_LEVEL=3
    ; SAS Polling interval (ms)
    -DSAS_POLL_INTERVAL_MS=40
    ; MQTT keep-alive interval (s)
    -DMQTT_KEEPALIVE=30
    ; Enable NVS (Non-Volatile Storage) for transaction persistence
    -DUSE_NVS=1
    ; 2026-09-14 correction: the previous fix here (-Wl,-u,_printf_float,
    ; added to "support" %f in ESP_LOGI) was based on an incomplete
    ; diagnosis and was itself the bug. Re-confirmed via addr2line on a
    ; real machine-01 reboot loop (Guru Meditation "Illegal instruction",
    ; MCAUSE=2) that the crash PC resolves inside _svfprintf_r itself
    ; (newlib vfprintf.c:1213) -- i.e. forcing that symbol to link pulls
    ; in a float-formatting implementation that emits real hardware FPU
    ; instructions, which do not exist on this chip (ESP32-C3 = RV32IMC,
    ; no F/D extension). Any %f/%.2f reaching it is a guaranteed crash,
    ; with or without this flag. Fix: removed every %f/%.2f from
    ; sas_polling.cpp (credits, handpay, meters, coin-in, AFT interrogate
    ; timeout logs) in favor of plain integer dollars.cents formatting
    ; (%lu.%02lu) -- matches the project-wide "never use float for money"
    ; rule already followed in backend/frontend. Do not re-add %f to any
    ; ESP_LOGx call on this target, and do not re-add this flag.

; ---------- Upload settings ---------
; Board has NO auto-reset circuit – esptool must NOT try RTS/DTR reset.
; Enter download mode manually: GPIO9→GND, pulse EN, release GPIO9.
upload_port     = COM7
; Lowered from 921600 (2026-09-05): 3 consecutive flashes failed mid-
; transfer with "serial noise/corruption" once more equipment (network
; switch, slot machine, V0259) was connected at the same time -- likely
; picking up electrical noise on the USB-serial line. 115200 is slower
; but has been reliable (matches led-test env, never seen this failure).
; Bump back up if you need faster iteration and things are quiet again.
; 2026-09-12/13: confirmed 921600 flashes reliably at ~2x speed when VSYS
; power is solid (direct USB or power bank, bypassing JW3510 inrush-current
; brownout). Kept at 115200 anyway since it's the safe default if someone
; flashes while powered through JW3510 without realizing -- bump manually
; per-session if you know the power source is good.
; 2026-09-13: tested 3000000 too -- works, but throughput barely improves
; over 921600 (710 vs 662 kbit/s, ~7%) since the FT232R + SLIP/ACK protocol
; overhead is the real bottleneck past this point. 921600 kept as the
; permanent default: same practical speed as 3M, tested reliable across
; many consecutive flashes (3M only tested once).
; Local override for this specific dev machine (2026-09-14, superseded same
; day -- see below): 921600 was failing reliably here (silence or "Invalid
; head of packet" noise), 115200 was the workaround. Root cause turned out to
; be misdiagnosed as a baud issue: it was actually (1) PlatformIO's Python
; crashing mid-flash on a console UnicodeEncodeError (fixed via
; PYTHONIOENCODING=utf-8 / PYTHONUTF8=1 set machine-wide) and (2) this FTDI
; adapter's Windows latency timer sitting at the 16ms default (lowered to 1ms
; in the registry for all known instance IDs of this adapter). With both
; fixed, retested back at 921600 same day -- reliable again, matching the
; 2026-09-12/13 finding above. Back to the permanent default.
upload_speed    = 921600
upload_protocol = esptool
; esptool 5.3.0 rejects the old underscore-style values these used to be
; (--after=no_hard_reset errors with "not a valid reset mode" when run
; directly) -- found 2026-09-05 while debugging a run of flash failures
; that consistently died right after "Hard resetting via RTS pin" printed
; mid-session (before the flash write even started). Suspect PlatformIO's
; scons wrapper was silently falling back to a real reset attempt instead
; of honoring "no reset" because of the deprecated names, and RTS/DTR
; toggling on this FTDI adapter coupling onto the data lines corrupted the
; download-mode session. Switched to the modern hyphenated values.
; 2026-09-14: esptool sync ("Connecting....") flakes out intermittently on
; this laptop's FTDI/USB stack even when the chip is confirmed sitting in
; ROM download mode (verified by reading the "waiting for download" banner
; directly off the serial port while a failed upload reported "No serial
; data received"). Default --connect-attempts is only 7 tries (~24s) before
; giving up. Raised to 40 (~2min worst case) so a single `pio run --target
; upload` self-heals past the flaky attempts instead of needing a manual
; retry. Safe to raise further if still not enough -- the ROM does not time
; out waiting in download mode.
upload_flags    =
    --before=no-reset
    --after=no-reset
    --connect-attempts=40

; ---------- Partition table ---------
; ETH01-Evo has 32Mbit = 4MB flash
board_build.partitions  = default.csv
board_upload.flash_size = 4MB

; ============================================================
; LED blink test – quick smoke-test for upload + GPIO.
; Usage: pio run -e led-test --target upload && pio device monitor
; ============================================================
[env:led-test]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino
upload_port     = COM7
monitor_port    = COM7
monitor_speed   = 115200
upload_speed    = 115200
upload_protocol = esptool
; esptool 5.3.0 rejects the old underscore-style values these used to be
; (--after=no_hard_reset errors with "not a valid reset mode" when run
; directly) -- found 2026-09-05 while debugging a run of flash failures
; that consistently died right after "Hard resetting via RTS pin" printed
; mid-session (before the flash write even started). Suspect PlatformIO's
; scons wrapper was silently falling back to a real reset attempt instead
; of honoring "no reset" because of the deprecated names, and RTS/DTR
; toggling on this FTDI adapter coupling onto the data lines corrupted the
; download-mode session. Switched to the modern hyphenated values.
; 2026-09-14: see eth01evo env for why --connect-attempts is raised here too.
upload_flags    =
    --before=no-reset
    --after=no-reset
    --connect-attempts=40
build_src_filter = -<*> +<../test_led/>

; ============================================================
; Native unit tests – pure logic (CRC, parity selection), run on
; the host PC, no hardware/board needed. `pio test -e native`.
; ============================================================
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++14
