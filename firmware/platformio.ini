; ============================================================
; PlatformIO Configuration – ESP32 Tourney GMI Module
; Target: WAVGAT/WT32-ETH01-Evo (ESP32-C3, RISC-V single-core)
; Ethernet: DM9051NP onboard via SPI (ETH_PHY_DM9051)
; Arduino Core: v3.x  (required for ETH.h + DM9051 via lwIP)
; NOTE: single core – SAS task and Network task now share Core 0,
; separated by FreeRTOS priority instead of core pinning.
; ============================================================

[platformio]
default_envs = eth01evo

[env:eth01evo]
; The official "espressif32" registry platform is stuck on Arduino core
; 3.20017 (Dec 2024), whose ETH.h has NO SPI-Ethernet overload at all
; (only the old RMII/LAN8720 signature) - confirmed by a real build
; failure. pioarduino's actively-maintained fork bundles Arduino core
; 3.3.11, which added ETH_PHY_DM9051/W5500/KSZ8851 SPI support.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino

; ---------- Serial Monitor ----------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------- Libraries ---------------
lib_deps =
    ; MQTT client (lightweight, supports TLS)
    knolleary/PubSubClient @ ^2.8.0
    ; JSON encode/decode for MQTT payloads
    bblanchon/ArduinoJson @ ^7.0.0

; ---------- Build flags -------------
; NOTE: ETH_PHY_DM9051 is an eth_phy_type_t enum value (see ETH.h),
; passed directly to ETH.begin() in code – do NOT also -D define it
; as a macro here, that substitutes "1" into the enum declaration
; itself and breaks the ETH.h header (this bit us during a real build).
build_flags =
    ; Debug level: 0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose
    -DCORE_DEBUG_LEVEL=3
    ; SAS Polling interval (ms)
    -DSAS_POLL_INTERVAL_MS=40
    ; MQTT keep-alive interval (s)
    -DMQTT_KEEPALIVE=30
    ; Enable NVS (Non-Volatile Storage) for transaction persistence
    -DUSE_NVS=1

; ---------- Upload settings ---------
; Board has NO native USB – flashing goes through the 6-pin debug
; header (EN/GND/3V3/TXD/RXD/IO0) via an external USB-TTL adapter.
; This board enters download mode via GPIO9=LOW at reset (NOT the
; usual GPIO0), per the vendor datasheet – there may be no auto-reset
; circuit, so a manual boot-button press could be required.
upload_speed    = 921600
upload_protocol = esptool

; ---------- Partition table ---------
; ETH01-Evo has 32Mbit = 4MB flash
board_build.partitions  = default.csv
board_upload.flash_size = 4MB
